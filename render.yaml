# Render Blueprint: deploys Silhouette as one free web service.
# Data lives in a hosted Postgres (e.g. Neon's free tier), set as DATABASE_URL when you create the service.
services:
  - type: web
    name: silhouette
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # AI try-on ("Make it real"): paste a Gemini API key from Google AI Studio. Leave empty to keep it off.
      - key: GEMINI_API_KEY
        sync: false
      # Daily caps that limit spending: per user, and for the whole site.
      - key: TRYON_PER_USER_DAILY
        value: "15"
      - key: TRYON_DAILY_LIMIT
        value: "200"
